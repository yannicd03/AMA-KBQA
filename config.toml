[llm]
chat_provider = "kit"
embedding_provider = "kit"
chat_temperature = 1.0
chat_max_tokens = 16000
embedding_temperature = 0.0

[agent]
auto_inject_journal = true
zero_tool_call_retry_max = 3
# Tool-loop engine: "legacy" (the in-class loop in framework/base_agent.py) or
# "graph" (the LangGraph StateGraph in ama_kbqa/graph/). Env override:
# AMA_AGENT_ENGINE. Default stays "legacy" until the rewrite reaches parity.
engine = "legacy"
# Graph-engine checkpointer (opt-in, only consulted when engine = "graph"):
# "none" (default, byte-identical to no checkpointer at all), "memory"
# (langgraph.checkpoint.memory.MemorySaver, process-lifetime only), or
# "sqlite" (langgraph.checkpoint.sqlite.aio.AsyncSqliteSaver, durable across
# process restarts). Env override: AMA_AGENT_CHECKPOINTER. Each per-question
# pipeline run gets its own thread_id (session_id + a per-question counter),
# so soft_reset() between benchmark questions always starts a fresh thread.
checkpointer = "none"
# Sqlite file for checkpointer = "sqlite" (relative to repo root unless
# absolute). Env override: AMA_AGENT_CHECKPOINTER_PATH.
checkpointer_path = "benchmark_results/checkpoints.sqlite"
# Per-call timeout for MCP tool servers, read by framework/mcp_client.py.
mcp_tool_timeout_seconds = 180

[benchmark]
# Number of questions processed concurrently by the benchmark runner.
# 1 = strictly serial (original behavior). Values > 1 use a pool of that many
# isolated agents (each with its own MCP subprocess) for near-linear throughput
# on the I/O-bound workload. Overridable per-run with --concurrency.
# Raise carefully: high values will hit provider rate limits.
concurrency = 1

[synthesis]
synthesis_enabled = false
synthesis_provider = "openrouter"
synthesis_model = "deepseek/deepseek-v3.2"
synthesis_model_provider = ""
synthesis_temperature = 0.7
synthesis_max_tokens = 2048
synthesis_mode = "conversational"

[openrouter]
base_url = "https://openrouter.ai/api/v1"
chat_model = "openrouter/elephant-alpha"
embedding_model = "qwen/qwen3-embedding-8b"
chat_model_provider = ""

[kit]
base_url = "https://ki-toolbox.scc.kit.edu/api/v1"
chat_model = "kit.gemma4-31b-it"
embedding_model = "kit.qwen3-embedding-8b"

[deepseek]
# Direct DeepSeek endpoint (OpenAI-compatible). Key: DEEPSEEK_API_KEY.
# Chat only; embeddings stay on KIT.
base_url = "https://api.deepseek.com"
chat_model = "deepseek-flash"
# DeepSeek runs every model in thinking mode by default, and a request that
# carries `tools` then requires each assistant message to be passed back with
# its `reasoning_content`. Our tool loop synthesises assistant tool_calls
# messages that have no reasoning to return, so the second turn of a question
# fails with a 400. false = send thinking.type = "disabled" on chat calls.
# Only set this to true for single-turn experiments.
thinking_enabled = false

[llamacpp]
base_url = "http://localhost:8080/v1"
chat_model = "local-model"
embedding_model = "local-model"
api_key = "sk-no-key-required"

[database]
qdrant_host = "localhost"
qdrant_port = 6335
collection_entities = "kqapro-entities"
collection_relations = "kqapro-relations"
virtuoso_endpoint = "http://localhost:8890/sparql"

[search]
top_n = 5
score_threshold = 0.6
sciqa_collection_entities = "sciqa-entities"
sciqa_collection_relations = "sciqa-relations"
sciqa_virtuoso_graph = "http://sciqa.org/kg"

[retrieval]
# Hybrid retrieval pipeline: dense + BM25 prefetch branches fused server-side
# (Qdrant Query API), optionally followed by a cross-encoder reranker.
# The BM25 branch is additive recall and falls back to dense-only (with a
# warning) on collections lacking the bm25 sparse index (run
# db/migrate_add_bm25.py to upgrade).
#
# EVIDENCE STATUS, corrected 2026-07-26. The numbers previously quoted here
# (SciQA 77 vs 73, KQAPro 81 vs 79) are the *dense_rerank* arm of
# rag-rerank-100q-2026-06-07; they do NOT describe this hybrid_rerank default,
# which scored SciQA 0.76 / KQAPro 0.79 in that same sweep. Across all four arms
# at n=100 no accuracy difference was significant (McNemar), while the
# reranker's latency cost was (Wilcoxon). Measured 2026-07-26: hybrid+rerank
# costs ~2.0 s/question of tool time against retrieval off, and turns went UP in
# every hybrid/reranked arm. See .agent/Tasks/active/retrieval-fusion-ab.md.
hybrid_enabled = false        # false = pure dense vector search + reranker ("dense_rerank")
# RESOLVED 2026-07-27 by the three-arm A/B (.agent/Tasks/active/retrieval-fusion-ab.md).
# Arms, gemma-4-31b-kit / seed 42, accuracy / avg turns:
#   A dense_rerank  KQAPro 0.850 / 9.03 (n=500)   SciQA 0.740 / 7.09
#   B hybrid+rrf    KQAPro 0.840 / 9.16 (n=100)   SciQA 0.750 / 7.09
#   C hybrid+dbsf   KQAPro 0.860 / 8.99 (n=100)   SciQA 0.760 / 7.10
# Nothing is significant: on SciQA all three arms are paired over the full
# 100-question split and every Wilcoxon (turns) / McNemar (accuracy) p >= 0.72.
# A and C are statistically indistinguishable, so A ships on SIMPLICITY: no BM25
# sparse index to maintain, no fusion step, no sparse vectors in the collections.
#
# Read the ordering B 9.16 > A 9.03 > C 8.99 carefully: DBSF was not adding
# value, it was removing damage RRF was doing. A branch contributing 2.0% unique
# recall (union-recall diagnostic, scripts/agent_keyword_recall.py) cannot
# produce a real gain, but fusing it badly can produce a real loss.
#
# `fusion` is INERT while hybrid_enabled = false. It is kept at dbsf because
# that is the better setting IF hybrid is ever re-enabled.
fusion = "dbsf"               # "rrf" | "dbsf" — unused unless hybrid_enabled
prefetch_limit = 20           # per-branch candidates before fusion
reranker_enabled = true       # independent of hybrid; also reranks dense-only results
reranker_model = "Alibaba-NLP/gte-reranker-modernbert-base"
rerank_candidates = 20        # fused/dense hits fed to the cross-encoder
# rerank_threshold = 0.0      # optional gate on cross-encoder scores; unset = no gate

[frontend]
# Live "explored subgraph" side panel in the demo chat page. Frontend-only:
# reads journal snapshots and tool results the agent already produces, so it
# costs no extra tool calls or tokens. Rendering is client-side (vis-network
# from CDN). Off = the page is exactly the pre-feature single-column layout.
# Override per deployment with AMA_FRONTEND_LIVE_GRAPH=0/1.
live_graph = true

# How much of the React demo's settings panel this build offers.
#   "minimal" — model, temperature and the view toggles only (public demo).
#   "full"    — additionally the Endpoints list (which chat/embedding endpoint
#               the build talks to, and whether its key is configured) and the
#               read-only build facts. Never the key itself.
# Default when the key is absent is "minimal", so an old config or a
# non-demo deployment never exposes endpoint detail by accident.
# Override per deployment with AMA_FRONTEND_SETTINGS_LEVEL=minimal|full.
settings_level = "full"

# Booth build: chat endpoints offered next to the auto-discovered KIT models.
# An entry is shown only when its provider's API key env var is set, and (for
# OpenRouter) only when the live catalog still knows the id and it can call
# tools. Prices are USD per 1M tokens and are what the booth account is
# actually billed; OpenRouter entries omit them on purpose so the picker shows
# the live catalog price rather than a number that silently goes stale here.
# `default = true` on one entry pre-selects it; otherwise the KIT default
# preference applies.
#
# ORDERING HAZARD: these are TOML *array tables*. Every plain [frontend] key
# above (live_graph, settings_level) must stay above them: a plain key written
# after the first [[frontend.chat_models]] header silently becomes a key of
# that array entry instead of a [frontend] key.
[[frontend.chat_models]]
provider = "openrouter"
id = "deepseek/deepseek-v4-flash"
name = "DeepSeek V4 Flash"

[[frontend.chat_models]]
provider = "openrouter"
id = "deepseek/deepseek-v4-pro"
name = "DeepSeek V4 Pro"

[[frontend.chat_models]]
provider = "openrouter"
id = "deepseek/deepseek-v4.1-flash"
name = "DeepSeek V4.1 Flash"

[[frontend.chat_models]]
provider = "openrouter"
id = "anthropic/claude-sonnet-4.5"
name = "Claude Sonnet 4.5"

[[frontend.chat_models]]
provider = "openrouter"
id = "openai/gpt-5"
name = "GPT-5"

[[frontend.chat_models]]
provider = "openrouter"
id = "google/gemini-2.5-pro"
name = "Gemini 2.5 Pro"

[[frontend.chat_models]]
provider = "deepseek"
id = "deepseek-flash"
name = "DeepSeek Flash (direct)"
prompt_usd_per_m = 0.30
completion_usd_per_m = 1.20

[[frontend.chat_models]]
provider = "deepseek"
id = "deepseek-v4-pro"
name = "DeepSeek V4 Pro (direct)"
prompt_usd_per_m = 1.32
completion_usd_per_m = 3.96

[federation]
# Allow the orchestrator to dispatch a question to multiple specialists
# concurrently and fuse their answers. Off by default: federation doubles
# token spend where it triggers, and the benchmark numbers were measured
# with single dispatch.
enabled = false
max_specialists = 2

[sciqa]
entity_threshold = 0.7
relation_threshold = 0.65
handcrafted_dataset = "db/datasets/SciQA/Handcrafted"
autogenerated_dataset = "db/datasets/SciQA/Autogenerated"

[logging]
level = "INFO"

[postprocessing]
judge_provider = "openrouter"
judge_model = "deepseek/deepseek-v4-pro"
chat_model_provider = ""
judge_temperature = 0.7
generate_fewshot = false

[fewshot_generator]
# LLM that analyzes benchmark traces and emits new fewshot examples / tool tips.
# Reads provider base_url + api_key_env from the matching [<provider>] section above.
provider = "openrouter"
model = "deepseek/deepseek-v4-pro"
temperature = 1.0
max_tokens = 16000
# When true, the agent's MCP tool catalog (names + signatures + descriptions) is
# injected into the generator prompt so it can judge whether the chosen tool path
# was the most direct one available.
include_tool_descriptions = true
# When true, the FULL conversation (all messages, untruncated tool results) is
# sent to the generator rather than the tail-window summary. Costs more tokens
# but lets the generator critique path optimality.
include_full_conversation = true
# Fallback truncation knobs — only used when include_full_conversation = false.
max_messages = 20
max_result_chars = 500
