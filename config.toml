[llm]
chat_provider = "openrouter"
embedding_provider = "openrouter"
chat_temperature = 0.2
chat_max_tokens = 15000
embedding_temperature = 0.0

[synthesis]
synthesis_provider = "openrouter"
synthesis_model = "deepseek/deepseek-v3.2"
synthesis_model_provider = ""
synthesis_temperature = 0.3
synthesis_max_tokens = 8000

[openrouter]
base_url = "https://openrouter.ai/api/v1"
chat_model = "minimax/minimax-m2.5"
embedding_model = "qwen/qwen3-embedding-8b"
chat_model_provider = ""

[kit]
base_url = "https://ki-toolbox.scc.kit.edu/api/v1"
chat_model = "azure.gpt-4.1-mini"

[database]
qdrant_host = "localhost"
qdrant_port = 6333
collection_entities = "kqapro-entities"
collection_relations = "kqapro-relations"
virtuoso_endpoint = "http://localhost:8890/sparql"

[search]
top_n = 5
score_threshold = 0.6
sciqa_collection_entities = "sciqa-entities"
sciqa_collection_relations = "sciqa-relations"
sciqa_virtuoso_graph = "http://sciqa.org/kg"

[sciqa]
entity_threshold = 0.7
relation_threshold = 0.65
handcrafted_dataset = "db/datasets/SciQA/Handcrafted"
autogenerated_dataset = "db/datasets/SciQA/Autogenerated"

[logging]
level = "INFO"

[postprocessing]
judge_provider = "openrouter"
judge_model = "deepseek/deepseek-v3.2"
chat_model_provider = ""
judge_temperature = 0.3
generate_fewshot = false
