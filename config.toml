# AMA KBQA Configuration File

[llm]
# Active LLM provider for chat/reasoning tasks
# Options: "lm_studio", "openrouter", "kit_ollama", "deepseek", "zai"
chat_provider = "openrouter"

# Active LLM provider for embedding tasks
# Options: "lm_studio", "openrouter", "kit_ollama"
embedding_provider = "openrouter"

# Model parameters
chat_temperature = 0.2
chat_max_tokens = 15000
embedding_temperature = 0.0

[synthesis]
# LLM configuration for final answer synthesis
# This controls which model generates the final answer after tool gathering
synthesis_provider = "openrouter"  # Which LLM provider to use for synthesis
synthesis_model = "deepseek/deepseek-v3.2"  # Model for synthesis (can be different from chat_model)
synthesis_model_provider = ""  # Empty = use OpenRouter's default routing (don't force minimax/fp8)
synthesis_temperature = 0.3  # Temperature for synthesis generation
synthesis_max_tokens = 8000  # Max tokens for final answer

[lm_studio]
# Local LM Studio server settings
base_url = "http://localhost:1234/v1"
# Model identifiers
chat_model = "qwen/qwen3-14b"
embedding_model = "text-embedding-3-small"
# API key (can be any string for local servers)
api_key = "lm-studio"

[openrouter]
# OpenRouter API settings (https://openrouter.ai/)
base_url = "https://openrouter.ai/api/v1"
# Model identifiers (use OpenRouter model names)
# Examples: deepseek/deepseek-v3.2-speciale
chat_model = "minimax/minimax-m2.1"
embedding_model = "qwen/qwen3-embedding-8b"
# Provider preference disabled - let OpenRouter use default routing
# The minimax/fp8 endpoint doesn't exist for minimax-m2 model
chat_model_provider = ""  # minimax/fp8, Empty = use OpenRouter's default routing
# API key will be read from OPENROUTER_API_KEY environment variable

[kit_ollama]
# KIT Ollama endpoint (https://ki-toolbox.scc.kit.edu/ollama)
base_url = "https://ki-toolbox.scc.kit.edu/ollama/api"
# Model identifier
chat_model = "gpt-oss:120b"
# API token will be read from KIT_OLLAMA_TOKEN environment variable
# For embeddings, you can use a different model or fallback to another provider

[deepseek]
# DeepSeek API settings (https://platform.deepseek.com/)
base_url = "https://api.deepseek.com/v1"
# Model identifier
chat_model = "deepseek-chat"
#embedding_model = "deepseek-embedding"
# API key will be read from DEEPSEEK_API_KEY environment variable

[zai]
# z.ai API settings (https://z.ai/)
base_url = "https://api.z.ai/v1"
# Model identifier
chat_model = "glm-4.6"
# API key will be read from ZAI_API_KEY environment variable

[database]
# Qdrant vector database settings
qdrant_host = "localhost"
qdrant_port = 6333
collection_entities = "kqapro-entities"
collection_relations = "kqapro-relations"

# Virtuoso SPARQL endpoint
virtuoso_endpoint = "http://localhost:8890/sparql"

[search]
# Vector search parameters
top_n = 5
score_threshold = 0.7

# SciQA/ORKG collections
sciqa_collection_entities = "sciqa-entities"
sciqa_collection_relations = "sciqa-relations"
sciqa_virtuoso_graph = "http://sciqa.org/kg"

[sciqa]
# SciQA-specific search thresholds
entity_threshold = 0.70
relation_threshold = 0.65

# Dataset paths
handcrafted_dataset = "db/datasets/SciQA/Handcrafted"
autogenerated_dataset = "db/datasets/SciQA/Autogenerated"

[logging]
# Logging configuration
level = "INFO"

[postprocessing]
# LLM Judge configuration for batch processing
# The judge evaluates answer correctness, reasoning quality, and provides improvement suggestions
judge_provider = "openrouter"  # Which LLM provider to use for judging
judge_model = "deepseek/deepseek-v3.2"  # Model for judging (can be different from chat_model)
chat_model_provider = ""
judge_temperature = 0.3  # Lower temperature for more consistent judgments
