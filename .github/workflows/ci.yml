name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - name: Install dependencies (incl. dev group)
        run: uv sync --group dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Test
        # The full suite (382 tests) is hermetic: fakes/mocks stand in for
        # Qdrant and Virtuoso everywhere (see e.g. tests/server/test_count_and_aggregate_hardening.py,
        # tests/server/test_orchestrator_server.py), and it was verified to pass
        # with no Docker services running and no env vars/.env set. No
        # deselect/marker filtering is needed here; if a future test genuinely
        # requires a live Virtuoso (8890) or Qdrant (6333) instance, mark it and
        # deselect it in this step rather than adding service containers to CI.
        run: uv run pytest -q
