# docker exec -i virtuoso_ama_kbqa isql 1111 dba kit_ama_kbqa "EXEC=ld_dir('/usr/share/proj', 'kb.nt', 'http://kqapro.org/kb'); rdf_loader_run(); checkpoint;"

name: ama-kbqa
services:
  virtuoso:
    image: openlink/virtuoso-opensource-7
    container_name: virtuoso_ama_kbqa
    restart: unless-stopped
    ports:
      # 8890 is the HTTP port (set in virtuoso.ini)
      - "127.0.0.1:8890:8890"
      # 1111 is the SQL port (set in virtuoso.ini)
      - "127.0.0.1:1111:1111"

    volumes:
      # 1. Bind mount for the persistent database files
      - ama_virtuoso_data:/database
      # 2. Bind mount for your data to be loaded
      - ./db/datasets/kqapro:/usr/share/proj
      # 3. SciQA/ORKG dataset mount
      - ./db/datasets/SciQA:/usr/share/proj/sciqa
    environment:
      - DBA_PASSWORD=kit_ama_kbqa
      - SPARQL_UPDATE=true

  qdrant:
    # Pinned >= v1.15.2 for server-side BM25 sparse inference (hybrid search);
    # v1.17.1 is the version the retrieval layer is tested against.
    image: qdrant/qdrant:v1.17.1
    container_name: qdrant_ama_kbqa
    restart: unless-stopped
    ports:
      - "127.0.0.1:6335:6333"
    volumes:
      - ama_qdrant_data:/qdrant/storage

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: ama-kbqa-frontend
    container_name: frontend_ama_kbqa
    restart: unless-stopped
    # Bridge network (default) so the frontend can reach 'qdrant' and
    # 'virtuoso' by service name; ports: exposes Streamlit to 127.0.0.1:8502
    # on the host (SSH-tunnel-only per our deployment model).
    ports:
      - "127.0.0.1:8502:8502"
    env_file:
      - ./.env
    volumes:
      # Container-specific config that references service-name hostnames
      # (host-side config.toml still uses localhost for direct ama-kbqa CLI use).
      - ./config.docker.toml:/app/config.toml
      - ./.streamlit_cache:/app/.streamlit
      - ./db/datasets:/app/db/datasets
      - ./db/kqapro_questionnaire.json:/app/db/kqapro_questionnaire.json:ro
      - ./db/sciqa_questionnaire.json:/app/db/sciqa_questionnaire.json:ro
      - ./benchmark_results:/app/benchmark_results
      - ./batch_results:/app/batch_results
    depends_on:
      qdrant:
        condition: service_started
      virtuoso:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:8502/_stcore/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  api:
    # FastAPI backend of the React demo (web/). Same image recipe as the
    # Streamlit frontend (Dockerfile.frontend), different entrypoint. Runs
    # uvicorn with exactly ONE worker: runs, sessions and multiturn agents
    # live in process memory, so a second worker would split them.
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: ama-kbqa-api
    container_name: api_ama_kbqa
    restart: unless-stopped
    command: ["ama-kbqa-api", "--host", "0.0.0.0", "--port", "8506"]
    # Reached by the web service as http://api:8506; the host port is only
    # for debugging (SSH-tunnel-only, like 8502).
    ports:
      - "127.0.0.1:8506:8506"
    # Lets the agents reach services on the Docker host by name, as the local
    # build (branch demo-llamacpp) does for its llama-server instances
    # (config.docker.toml: http://host.docker.internal:8080/v1). Linux Docker
    # does not define that name by itself; host-gateway maps it to the host.
    # Harmless on builds that never use it.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ./.env
    volumes:
      # The Streamlit frontend's mounts minus .streamlit_cache: the API never
      # runs Streamlit, and a missing host dir would be created root-owned.
      # The agents read the same config (service-name hostnames), datasets
      # and questionnaires.
      - ./config.docker.toml:/app/config.toml
      - ./db/datasets:/app/db/datasets
      - ./db/kqapro_questionnaire.json:/app/db/kqapro_questionnaire.json:ro
      - ./db/sciqa_questionnaire.json:/app/db/sciqa_questionnaire.json:ro
      - ./benchmark_results:/app/benchmark_results
      - ./batch_results:/app/batch_results
    depends_on:
      qdrant:
        condition: service_started
      virtuoso:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:8506/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    # React demo frontend: the static Vite build served by nginx, which also
    # proxies /api/ to the api service (SSE-safe, buffering off). Runs next
    # to the Streamlit frontend, which stays the default demo on 8502.
    build:
      context: ./web
      dockerfile: Dockerfile
    image: ama-kbqa-web
    container_name: web_ama_kbqa
    restart: unless-stopped
    ports:
      - "127.0.0.1:8505:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
volumes:
  ama_qdrant_data:
  ama_virtuoso_data:
