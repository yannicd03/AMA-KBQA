[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ama-kbqa"
version = "0.1.0"
description = "AMA KBQA"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "Yannic Duan"},
    {name = "Maximilian Klattig"},
    {name = "Maurice Bardenhagen"},
    {name = "Yuyang Li"}
]
dependencies = [
    "openai-agents>=0.5.1",
    "qdrant-client>=1.17.0",
    "rdflib>=7.4.0",
    "streamlit>=1.51.0",
    "openai>=1.53.0",
    "python-dotenv>=1.0.1",
    "tenacity>=9.0.0",
    "fastapi>=0.115.0",
    "uvicorn==0.38.0",
    "requests>=2.32.5",
    "loguru>=0.7.3",
    "fastmcp>=2.13.1",
    "sparqlwrapper>=2.0.0",
    "htbuilder>=0.9.0",
    "chatkit",
]

[project.optional-dependencies]
# Cross-encoder reranker for the retrieval pipeline (pulls torch, ~GB of
# wheels). Only needed when [retrieval].reranker_enabled = true:
#   uv sync --extra rerank
rerank = [
    "sentence-transformers>=3.0.0",
    "transformers>=4.48",  # native ModernBERT support for the default reranker
]

[project.scripts]
ama-kbqa = "ama_kbqa.cli:main"
ama-kbqa-frontend = "ama_kbqa.cli:frontend"

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "pytest>=9.0.2",
    "ruff>=0.15.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ama_kbqa*"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Default rule set: pyflakes (F), pycodestyle errors (E4/E7/E9).
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Large, pre-existing server modules the user has asked not to be touched
# (see task constraints). Lint violations are suppressed here rather than
# fixed in place. Codes below are the exact violation types found in each
# file: unused imports, late imports (deferred to avoid heavy import-time
# side effects), placeholder-less f-strings, a shadowed re-import, unused
# locals, and bare excepts.
"ama_kbqa/server/sciqa_server.py" = ["F401", "F541", "F841"]
"ama_kbqa/server/kqapro_server.py" = ["F401", "E402", "F541", "F811", "E722", "F841"]
# The `importlib.import_module(...)` call must run before the `from ... import`
# below it (it resolves the submodule so the package `__init__` re-export
# doesn't shadow it); reordering would break the workaround the comment above
# it documents.
"tests/retrieval/test_search.py" = ["E402"]

[tool.uv.sources]
chatkit = { git = "https://github.com/yannicd03/ChatKIT.git", rev = "c9fcebc2a73065e8e00a2154327c859dc01403d8" }
