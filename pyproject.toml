[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ama-kbqa"
version = "0.1.0"
description = "AMA KBQA"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.1.0",
    "openai-agents>=0.5.1",
    "qdrant-client>=1.15.1",
    "qlever>=0.5.33",
    "rdflib>=7.4.0",
    "streamlit>=1.51.0",
    "openai>=1.53.0",
    "python-dotenv>=1.0.1",
    "tenacity>=9.0.0",
    "fastapi>=0.115.0",
    "uvicorn==0.38.0",
    "openai-agents>=0.5.1",
    "streamlit>=1.51.0",
    "requests>=2.32.5",
    "loguru>=0.7.3",
    "fastmcp>=2.13.1",
    "sparqlwrapper>=2.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ama_kbqa*"]
