# Static React build + same-origin proxy to the AMA-KBQA API.
# Installed as /etc/nginx/conf.d/default.conf in the web image.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    # text/event-stream is deliberately absent: compressing SSE would buffer it.
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # API, including the Server-Sent Events stream of a run. Buffering off so
    # every snapshot reaches the browser immediately; the long read timeout
    # covers multi-minute runs (the backend also sends a keepalive every 15 s).
    location /api/ {
        proxy_pass http://api:8506;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        gzip off;
    }

    # Vite puts content-hashed files under /assets/: cache them forever.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The entry point must always be revalidated so a new build is picked up.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
